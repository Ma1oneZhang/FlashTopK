[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flashtopk"
version = "0.1.0"
description = "Fast, exact, deterministic fused top-k selection for learned sparse attention"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.6",
    "triton>=3.3",
    "nvidia-cutlass-dsl>=4.5",
    "apache-tvm-ffi",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["flashtopk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
